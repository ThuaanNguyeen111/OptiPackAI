apiVersion: apps/v1
kind: Deployment
metadata:
  name: be
  labels: { app: be }
spec:
  replicas: 1
  selector:
    matchLabels: { app: be }
  template:
    metadata:
      labels: { app: be }
    spec:
      containers:
        - name: be
          image: optipackai-be:local
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 3000
          envFrom:
            # Thứ tự có ý nghĩa: ConfigMap đứng SAU nên ghi đè được các biến
            # trùng tên trong Secret (vd REDIS_HOST=localhost trong be/.env).
            - secretRef: { name: optipackai-be-env }
            - configMapRef: { name: optipackai-be-config }
          volumeMounts:
            # File service account Firebase cho push (FCM_SERVICE_ACCOUNT_FILE trong ConfigMap).
            - name: fcm
              mountPath: /etc/fcm
              readOnly: true
          readinessProbe:
            httpGet: { path: /api, port: 3000 }
            initialDelaySeconds: 10
            periodSeconds: 10
            failureThreshold: 6
          livenessProbe:
            httpGet: { path: /api, port: 3000 }
            initialDelaySeconds: 40
            periodSeconds: 20
            failureThreshold: 3
          resources:
            requests: { cpu: 100m, memory: 384Mi }
            limits: { cpu: '1', memory: 1Gi }
      volumes:
        - name: fcm
          secret:
            secretName: optipackai-fcm
            # Chưa tạo Secret thì pod vẫn chạy, chỉ không gửi được push.
            optional: true
---
apiVersion: v1
kind: Service
metadata:
  name: be
spec:
  selector: { app: be }
  ports:
    - port: 3000
      targetPort: 3000
