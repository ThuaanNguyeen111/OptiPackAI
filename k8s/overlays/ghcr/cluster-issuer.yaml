# Apply MỘT LẦN bằng tay sau khi cài cert-manager (không nằm trong kustomization
# vì là tài nguyên toàn cụm, cần CRD của cert-manager có trước):
#   kubectl apply -f k8s/overlays/ghcr/cluster-issuer.yaml
apiVersion: cert-manager.io/v1
kind: ClusterIssuer
metadata:
  name: letsencrypt
spec:
  acme:
    server: https://acme-v02.api.letsencrypt.org/directory
    privateKeySecretRef:
      name: letsencrypt-account
    solvers:
      - http01:
          ingress:
            ingressClassName: nginx
