# Domain thật (thay ingress *.optipackai.local của base):
#   https://optipack.io.vn         → fe
#   https://optipack.io.vn/api/... → be (backend tự có global prefix /api)
#   https://shop.optipack.io.vn    → storefront
#   https://aurelle.optipack.io.vn → sàn giả lập AURELLE (trang cấp quyền + Developer Console)
# packer KHÔNG ra Internet: chỉ be gọi nội bộ http://packer:8000.
# HTTPS: Cloudflare proxy (Full strict) → Secret optipack-tls chứa Cloudflare Origin
# Certificate, tạo tay một lần: kubectl -n optipackai create secret tls optipack-tls ...
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: optipack-web
spec:
  ingressClassName: nginx
  tls:
    - hosts: [optipack.io.vn, shop.optipack.io.vn, aurelle.optipack.io.vn]
      secretName: optipack-tls
  rules:
    - host: optipack.io.vn
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service: { name: fe, port: { number: 80 } }
    - host: shop.optipack.io.vn
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service: { name: storefront, port: { number: 3001 } }
    - host: aurelle.optipack.io.vn
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service: { name: aurelle, port: { number: 4000 } }
---
# Ingress riêng để giới hạn body upload chỉ cho API. Dùng chung chứng chỉ optipack-tls.
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: optipack-api
  annotations:
    nginx.ingress.kubernetes.io/proxy-body-size: '10m'
spec:
  ingressClassName: nginx
  tls:
    - hosts: [optipack.io.vn]
      secretName: optipack-tls
  rules:
    - host: optipack.io.vn
      http:
        paths:
          - path: /api
            pathType: Prefix
            backend:
              service: { name: be, port: { number: 3000 } }
