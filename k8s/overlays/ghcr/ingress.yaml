# Domain thật (thay ingress *.optipackai.local của base):
#   https://optipack.io.vn         → fe
#   https://optipack.io.vn/api/... → be (backend tự có global prefix /api)
#   https://shop.optipack.io.vn    → storefront
# packer KHÔNG ra Internet: chỉ be gọi nội bộ http://packer:8000.
# HTTPS: cert-manager + Let's Encrypt (ClusterIssuer trong cluster-issuer.yaml).
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: optipack-web
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt
spec:
  ingressClassName: nginx
  tls:
    - hosts: [optipack.io.vn, shop.optipack.io.vn]
      secretName: optipack-tls
  rules:
    - host: optipack.io.vn
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service: { name: fe, port: { number: 80 } }
    - host: shop.optipack.io.vn
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service: { name: storefront, port: { number: 3001 } }
---
# Ingress riêng để giới hạn body upload chỉ cho API. Dùng chung chứng chỉ optipack-tls.
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: optipack-api
  annotations:
    nginx.ingress.kubernetes.io/proxy-body-size: '10m'
spec:
  ingressClassName: nginx
  tls:
    - hosts: [optipack.io.vn]
      secretName: optipack-tls
  rules:
    - host: optipack.io.vn
      http:
        paths:
          - path: /api
            pathType: Prefix
            backend:
              service: { name: be, port: { number: 3000 } }
