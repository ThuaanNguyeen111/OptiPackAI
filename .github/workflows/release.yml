name: Release images

# Đẩy image lên GitHub Container Registry (ghcr.io) để cụm Kubernetes thật
# pull về. Không tự động apply lên cụm nào — bước deploy vẫn do người chạy
# (xem k8s/README.md), tránh việc CI tự đụng vào môi trường thật.
on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:
    inputs:
      api_url:
        description: 'URL backend mà trình duyệt gọi (nhúng vào bundle FE/storefront lúc build)'
        required: true
        default: 'http://api.optipackai.local'

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  REGISTRY: ghcr.io
  # ghcr yêu cầu chữ thường toàn bộ đường dẫn image.
  IMAGE_PREFIX: ghcr.io/${{ github.repository_owner }}/optipackai

jobs:
  build-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: be
            dockerfile: be/Dockerfile
            build_args: ''
          - name: fe
            dockerfile: fe/Dockerfile
            build_args: VITE_API_URL=${{ inputs.api_url || 'http://api.optipackai.local' }}
          - name: storefront
            dockerfile: storefront/Dockerfile
            build_args: NEXT_PUBLIC_API_URL=${{ inputs.api_url || 'http://api.optipackai.local' }}
    steps:
      - uses: actions/checkout@v4

      - name: Bỏ qua nếu Dockerfile chưa tồn tại
        id: check
        run: |
          if [ -f "${{ matrix.dockerfile }}" ]; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
            echo "::notice::Chưa có ${{ matrix.dockerfile }} — bỏ qua image ${{ matrix.name }}."
          fi

      - uses: docker/setup-buildx-action@v3
        if: steps.check.outputs.exists == 'true'

      - uses: docker/login-action@v3
        if: steps.check.outputs.exists == 'true'
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Tính tag cho image
        if: steps.check.outputs.exists == 'true'
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE_PREFIX }}-${{ matrix.name }}
          tags: |
            type=ref,event=branch
            type=semver,pattern={{version}}
            type=sha,format=short
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build & push
        if: steps.check.outputs.exists == 'true'
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          push: true
          build-args: ${{ matrix.build_args }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=${{ matrix.name }}
          cache-to: type=gha,mode=max,scope=${{ matrix.name }}
