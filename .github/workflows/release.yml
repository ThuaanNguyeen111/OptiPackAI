name: Release & deploy

# CI xanh trên main → build image lên ghcr.io → SSH vào VPS k3s apply với tag
# sha-<commit>. Image nào mã nguồn không đổi thì không build lại, chỉ gắn thêm tag.
#
# GitHub → Settings → Secrets and variables → Actions, tạo các secret cho job deploy:
#   DEPLOY_HOST         IP server, vd 162.4.176.64
#   DEPLOY_PORT         cổng SSH của server, vd 24700 (bỏ trống = 22)
#   DEPLOY_SSH_KEY      private key SSH (public key nằm trong ~/.ssh/authorized_keys của root trên server)
#   DEPLOY_KNOWN_HOSTS  output của `ssh-keyscan -p <PORT> <IP>` (chống giả mạo server)
# Bí mật backend KHÔNG nằm trên GitHub: đặt sẵn file /root/optipackai/be.env trên
# server (chmod 600); mỗi lần deploy nạp lại Secret k8s từ file đó.
on:
  # Chỉ chạy khi workflow CI chạy xong trên main; job build tự bỏ qua nếu CI đỏ.
  workflow_run:
    workflows: ['CI']
    types: [completed]
    branches: [main]
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      api_url:
        description: 'URL backend mà trình duyệt gọi (nhúng vào bundle FE/storefront lúc build)'
        required: true
        default: 'https://optipack.io.vn/api'

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  REGISTRY: ghcr.io
  # ghcr yêu cầu chữ thường toàn bộ đường dẫn image.
  IMAGE_PREFIX: ghcr.io/${{ github.repository_owner }}/optipackai
  # Với workflow_run, github.sha là đầu main lúc kích hoạt, chưa chắc là commit CI vừa kiểm tra.
  SHA: ${{ github.event.workflow_run.head_sha || github.sha }}
  API_URL: ${{ inputs.api_url || 'https://optipack.io.vn/api' }}

jobs:
  build-push:
    # Tên tĩnh, matrix chỉ 1 giá trị → GitHub hiện gọn "Build image (be)".
    name: Build image
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        app: [be, fe, storefront, packer]
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.SHA }}

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # src-<key> = băm nội dung các thư mục/file image dùng (+ build arg). Tag này
      # đã có trên ghcr nghĩa là đúng mã nguồn đó đã build rồi → khỏi build lại.
      - name: Tính tag và kiểm tra image đã có chưa
        id: plan
        env:
          APP: ${{ matrix.app }}
        run: |
          # Thư mục/file mà image dùng (để băm) và build arg nhúng URL API.
          case "$APP" in
            packer) PATHS="packer"; ARG_NAME="" ;;
            fe) PATHS="fe package.json package-lock.json"; ARG_NAME="VITE_API_URL" ;;
            storefront) PATHS="storefront package.json package-lock.json"; ARG_NAME="NEXT_PUBLIC_API_URL" ;;
            *) PATHS="$APP package.json package-lock.json"; ARG_NAME="" ;;
          esac
          # Owner repo có chữ hoa (ThuaanNguyeen111) mà ghcr bắt buộc chữ thường.
          IMG="${IMAGE_PREFIX,,}-$APP"
          ARG=""; [ -n "$ARG_NAME" ] && ARG="$ARG_NAME=$API_URL"
          KEY=$( { for p in $PATHS; do git rev-parse "HEAD:$p"; done; echo "$ARG"; } | sha256sum | cut -c1-16)
          TAGS="$IMG:sha-${SHA::7}"
          [ "${{ github.ref }}" = refs/heads/main ] && TAGS="$TAGS,$IMG:latest"
          [ "${{ github.ref_type }}" = tag ] && TAGS="$TAGS,$IMG:${GITHUB_REF_NAME#v}"
          {
            echo "src=$IMG:src-$KEY"
            echo "tags=$TAGS"
            echo "arg=$ARG"
          } >> "$GITHUB_OUTPUT"
          if docker buildx imagetools inspect "$IMG:src-$KEY" >/dev/null 2>&1; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
            echo "::notice::$APP: mã nguồn không đổi, dùng lại $IMG:src-$KEY"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Gắn tag mới cho image có sẵn (không build)
        if: steps.plan.outputs.exists == 'true'
        env:
          SRC: ${{ steps.plan.outputs.src }}
          TAGS: ${{ steps.plan.outputs.tags }}
        run: docker buildx imagetools create $(printf -- '-t %s ' ${TAGS//,/ }) "$SRC"

      - name: Build & push
        if: steps.plan.outputs.exists == 'false'
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ matrix.app }}/Dockerfile
          push: true
          build-args: ${{ steps.plan.outputs.arg }}
          tags: ${{ steps.plan.outputs.src }},${{ steps.plan.outputs.tags }}
          labels: org.opencontainers.image.revision=${{ env.SHA }}
          cache-from: type=gha,scope=${{ matrix.app }}
          cache-to: type=gha,mode=max,scope=${{ matrix.app }}

  deploy:
    name: Deploy lên server
    needs: build-push
    # Chỉ main mới lên server; tag v* chỉ phát hành image.
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    concurrency:
      group: deploy-production
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.SHA }}

      - name: Ghim tag image theo commit
        run: |
          sed -i "s/newTag: latest/newTag: sha-${SHA::7}/" k8s/overlays/ghcr/kustomization.yaml

      - name: Chuẩn bị SSH
        env:
          SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/id_deploy && chmod 600 ~/.ssh/id_deploy
          printf '%s\n' "$KNOWN_HOSTS" > ~/.ssh/known_hosts

      - name: Apply lên k3s
        env:
          HOST: ${{ secrets.DEPLOY_HOST }}
          PORT: ${{ secrets.DEPLOY_PORT }}
        run: |
          # pipefail: không có thì lỗi ssh bị "| tee" che, bước vẫn báo xanh.
          set -o pipefail
          tar -czf - k8s scripts/k8s-create-secret.sh | ssh -i ~/.ssh/id_deploy -p "${PORT:-22}" "root@$HOST" '
            set -euo pipefail
            d=$(mktemp -d); trap "rm -rf $d" EXIT
            tar -xzf - -C "$d" && cd "$d"
            ENV_FILE=/root/optipackai/be.env bash scripts/k8s-create-secret.sh
            kubectl apply -k k8s/overlays/ghcr
            for x in redis packer be fe storefront aurelle; do
              kubectl -n optipackai rollout status deploy/$x --timeout=300s
            done
            kubectl -n optipackai get pods' | tee pods.txt

      # Trang Summary của lượt chạy: commit nào vừa lên và trạng thái pod.
      - name: Tóm tắt
        if: always()
        run: |
          {
            echo "### Deploy \`${SHA::7}\` lên optipack.io.vn"
            echo '```'
            sed -n '/^NAME /,$p' pods.txt 2>/dev/null | grep . || echo "(không lấy được danh sách pod)"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
