# Cấu hình nginx phục vụ bản build tĩnh của Vite (fe/dist).
server {
  listen 8080;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  # Nén text để giảm băng thông (bundle FE hiện ~1.9MB chưa nén).
  gzip on;
  gzip_types text/plain text/css application/javascript application/json image/svg+xml;
  gzip_min_length 1024;

  # Asset có hash trong tên -> cache dài hạn an toàn.
  location /assets/ {
    expires 1y;
    add_header Cache-Control "public, immutable";
    try_files $uri =404;
  }

  # SPA dùng react-router: mọi đường dẫn không phải file thật đều trả
  # index.html, nếu không F5 ở /app/orders sẽ ra 404.
  location / {
    try_files $uri $uri/ /index.html;
  }

  # Endpoint để k8s readiness/liveness probe gọi, không đụng tới SPA.
  location = /healthz {
    access_log off;
    return 200 "ok\n";
  }
}
